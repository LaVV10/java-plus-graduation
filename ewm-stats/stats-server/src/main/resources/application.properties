# Bootstrap-минимум: имя приложения (под этим именем ищется stats-server.yml на config-server),
# импорт централизованного конфига и регистрация в Eureka.
# Остальные настройки datasource/JPA/etc. приходят из Config Server (config_repo/stats-server.yml).
#
# CONFIG_SERVER_URL задаётся окружением:
#   - локально: http://localhost:8888
#   - в docker: http://config-server:8888 (имя контейнера)
spring.application.name=stats-server

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
