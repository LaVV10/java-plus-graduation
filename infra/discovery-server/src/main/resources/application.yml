server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # Standalone-инстанс: не регистрируется сам у себя и не скачивает реестр
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  server:
    # Чуть мягче интервалы для локальной разработки
    wait-time-in-ms-when-sync-empty: 0
