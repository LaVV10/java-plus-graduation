# Конфигурация analyzer, раздаваемая через Config Server.
# gRPC-сервер на случайном порту (клиенты находят через discovery:///analyzer).
grpc:
  server:
    port: 0

server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      # analyzer владеет таблицами event_similarity / user_action и инициализирует их схему.
      mode: always
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm_analyzer}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Confluent Schema Registry — Avro wire format.
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    consumer:
      group-id: analyzer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true

app:
  kafka:
    # Top-level свойство — читается через @Value в KafkaConsumerConfig.
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1
  recommendations:
    neighbors: 5
