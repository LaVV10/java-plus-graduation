# Конфигурация analyzer, раздаваемая через Config Server.
# gRPC-сервер на случайном порту (клиенты находят через discovery:///analyzer).
# Avro-десериализация — кастомная (AvroDeserializer), чистый Avro без Schema Registry.
grpc:
  server:
    port: 0

server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      # analyzer владеет таблицами event_similarity / user_action и инициализирует их схему.
      mode: always
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm_analyzer}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # group.id генерируется динамически (UUID-суффикс) в KafkaConsumerConfig,
      # чтобы каждый запуск получал новую группу и не наследовал offset'ы прошлых
      # прогонов CI. auto-offset-reset=latest + seekToEnd пропускают старые битые
      # сообщения в топике (см. паттерн в референс-решениях Danny1kk).
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1
  recommendations:
    neighbors: 5
