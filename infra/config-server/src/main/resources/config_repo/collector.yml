# Конфигурация collector, раздаваемая через Config Server.
# gRPC-сервер на случайном порту (регистрируется в Eureka, клиенты находят через discovery:///collector).
grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Сериализаторы указываются в KafkaProducerConfig (AvroSerializer — кастомный,
    # Confluent wire format без Schema Registry).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      retries: 3
      properties:
        linger.ms: 0
    topic:
      user-actions: stats.user-actions.v1
