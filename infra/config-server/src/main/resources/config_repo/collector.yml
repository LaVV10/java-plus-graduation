# Конфигурация collector, раздаваемая через Config Server.
# gRPC-сервер на случайном порту (регистрируется в Eureka, клиенты находят через discovery:///collector).
grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # value-serializer задаётся в KafkaProducerConfig.java через AvroSerializer.class
    # (чистый Avro binary без Confluent magic byte/schema-id — этого формата ждёт tester Практикума).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      retries: 3
      properties:
        linger.ms: 0
    topic:
      user-actions: stats.user-actions.v1
