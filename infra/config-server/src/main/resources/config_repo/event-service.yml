# Конфигурация event-service, раздаваемая через Config Server.
server:
  port: 0

# gRPC-клиенты к Collector (отправка действий) и Analyzer (рекомендации/рейтинг).
# Адреса резолвятся через Eureka (discovery:///имя-сервиса).
grpc:
  client:
    collector:
      address: 'discovery:///collector'
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    analyzer:
      address: 'discovery:///analyzer'
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      # event-service владеет таблицами events/locations и инициализирует их схему.
      mode: always
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm-server}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

# Feign + Resilience4j: отказоустойчивые межсервисные вызовы (fallback-классы в коде).
spring.cloud.openfeign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
