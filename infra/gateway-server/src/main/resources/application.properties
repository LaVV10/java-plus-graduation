# Bootstrap-минимум: имя приложения (под этим именем ищется gateway-server.yml на config-server),
# импорт централизованного конфига и регистрация в Eureka. Маршруты и порт 8080 приходят
# из Config Server (config_repo/gateway-server.yml).
#
# CONFIG_SERVER_URL задаётся окружением:
#   - локально: http://localhost:8888
#   - в docker: http://config-server:8888 (имя контейнера)
spring.application.name=gateway-server

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# Резервный порт (маршруты берутся из config-server, без него gateway бесполезен).
server.port=8080
