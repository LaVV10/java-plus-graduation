# Bootstrap-минимум: имя приложения (под этим именем ищется gateway-server.yml на config-server),
# импорт централизованного конфига и регистрация в Eureka.
# Маршруты и порт 8080 приходят из Config Server (config_repo/gateway-server.yml);
# ниже — резервные значения на случай недоступности config-server.
#
# CONFIG_SERVER_URL задаётся окружением:
#   - локально: http://localhost:8888
#   - в docker: http://config-server:8888 (имя контейнера)
spring.application.name=gateway-server

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# Резервные настройки (используются, если config-server недоступен)
# Внимание: префикс маршрутов gateway-mvc — spring.cloud.gateway.mvc.*
server.port=8080
spring.cloud.gateway.mvc.discovery.locator.enabled=true
spring.cloud.gateway.mvc.routes[0].id=main-service
spring.cloud.gateway.mvc.routes[0].uri=lb://main-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/**
