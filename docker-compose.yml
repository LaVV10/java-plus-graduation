services:
  # ─── Служба обнаружения (Eureka) ───────────────────────────────────────
  discovery-server:
    build: ./infra/discovery-server
    image: discovery-server-image
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Сервер конфигурации (native-профиль, конфиги в config_repo) ───────
  config-server:
    build: ./infra/config-server
    image: config-server-image
    container_name: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
    healthcheck:
      # config-server отдаёт JSON на запрос своего имени приложения
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/config-server/default"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ─── API-шлюз (порт 8080, маршруты к main-service) ────────────────────
  gateway-server:
    build: ./infra/gateway-server
    image: gateway-server-image
    container_name: gateway-server
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      # Внутри контейнера gateway слушает 8080 (по ТЗ). На хост-порт 8081,
      # т.к. 8080 занят сторонним процессом AgentService.exe.
      - "8081:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888

  # ─── БД статистики ────────────────────────────────────────────────────
  stats-db:
    image: postgres:15.1-alpine
    container_name: EWM-stats-db
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Сервис статистики (порт случайный, регистрируется в Eureka) ──────
  stats-server:
    restart: on-failure
    build: ./ewm-stats/stats-server
    image: stats-server-image
    container_name: ewm-stats-server
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=docker

  # ─── БД основного сервиса ─────────────────────────────────────────────
  ewm-db:
    image: postgres:15.1-alpine
    container_name: EWM-server-db
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_DB=ewm-server
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ewm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Основной сервис (порт случайный, регистрируется в Eureka) ────────
  ewm-service:
    build: ./core/main-service
    image: ewm-service-image
    container_name: ewm-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ewm-db:5432/ewm-server
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=docker

volumes:
  stats-db-data:
  ewm-db-data:
